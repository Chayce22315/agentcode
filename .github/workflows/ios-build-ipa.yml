name: iOS build (unsigned IPA)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build unsigned app (device, generic iOS)
        run: |
          set -euo pipefail
          xcodebuild \
            -project AIApp/AIApp.xcodeproj \
            -scheme AIApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA (manual Payload zip)
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/AIApp.app"
          test -d "$APP"
          chmod +x tools/package-ipa.sh
          ./tools/package-ipa.sh "$APP" "AIApp-unsigned.ipa"
          shasum -a 256 AIApp-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIApp-unsigned-ipa
          path: AIApp-unsigned.ipa
